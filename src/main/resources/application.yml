spring:
  application:
    name: msj-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
    username: ${DB_USER:neondb_owner}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2           # V1/V2 already applied; future migrations start at V3
    locations: classpath:db/migration
  servlet:
    multipart:
      # Overridable per environment so a smaller box can cap it lower without
      # a rebuild. 400MB covers a full-issue scan with high-resolution plates.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:400MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:420MB}
      # Spool to disk immediately rather than buffering in heap — at 400MB the
      # default in-memory threshold would be an OOM waiting to happen.
      file-size-threshold: 1MB
      # Temp spool directory. Empty = the servlet container's default. Set
      # UPLOAD_TMP_DIR to a path on a real volume if /tmp is a small tmpfs —
      # a 400MB upload is written there in full before it is stored.
      location: ${UPLOAD_TMP_DIR:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    # When a request is rejected (too large, unauthorised, validation error)
    # Tomcat reads and discards the rest of the body so the connection can be
    # reused. The default cap is 2MB; past that it resets the connection, and
    # the browser reports "network error" instead of the 413 the server sent.
    # -1 = swallow whatever it takes, so large uploads fail with a real message.
    max-swallow-size: -1
    # A 400MB upload over a slow link must not be killed mid-stream.
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:300s}
    max-http-form-post-size: ${UPLOAD_MAX_REQUEST_SIZE:420MB}

# ----- application-specific config -----
msj:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-a-long-random-256-bit-secret-key-value}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:14}
    issuer: msj.aztu.edu.az
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  storage:
    provider: ${STORAGE_PROVIDER:local}          # local | s3
    local-path: ${STORAGE_LOCAL_PATH:./storage}
    public-base-url: ${STORAGE_PUBLIC_URL:http://localhost:8080/files}
  mail:
    from: ${MAIL_FROM:no-reply@msj.aztu.edu.az}
    enabled: ${MAIL_ENABLED:false}
  frontend:
    web-url: ${WEB_URL:http://localhost:3000}
    admin-url: ${ADMIN_URL:http://localhost:3001}
  citations:
    enabled: ${CITATIONS_ENABLED:true}
    mailto: ${CITATIONS_MAILTO:msj@aztu.edu.az}      # Crossref polite-pool contact (no API key needed)
    cron: ${CITATIONS_CRON:0 0 3 * * SUN}            # weekly refresh, Sunday 03:00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false        # dev SMTP is optional; don't fail health when it's absent

logging:
  level:
    az.edu.aztu.msj: ${LOG_LEVEL:INFO}
    org.flywaydb: INFO
